name: Phase 1A

on:
  push:
    branches:
      - phase/1a-prompt-compiler

jobs:
  prompt-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowforge/compiler build
      - run: pnpm --filter @flowforge/compiler test
