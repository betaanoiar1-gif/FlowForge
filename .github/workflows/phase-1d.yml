name: Phase 1D

on:
  push:
    branches:
      - phase/1d-execution-events

jobs:
  execution-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node packages/queue/test/execution-events.test.mjs
